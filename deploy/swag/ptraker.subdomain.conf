# portfolioTraker — nginx proxy conf for Swag
# Handles three domains:
#   ptraker.com / www.ptraker.com  → ptraker-client container (React SPA)
#   api.ptraker.com                → ptraker-api container (Express)
#   supabase.ptraker.com           → supabase-ptraker-kong container (browser auth client)
#
# Deploy to: /data/proxy/letsencrypt/config/nginx/proxy-confs/ptraker.subdomain.conf
# After copying: docker exec swag nginx -t && docker exec swag nginx -s reload

# ---------------------------------------------------------------------------
# ptraker.com — React SPA client
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name ptraker.com www.ptraker.com;

    ssl_certificate     /config/keys/letsencrypt/fullchain.pem;
    ssl_certificate_key /config/keys/letsencrypt/privkey.pem;
    include /config/nginx/ssl.conf;
    include /config/nginx/resolver.conf;

    set $upstream_app   ptraker-client;
    set $upstream_port  80;
    set $upstream_proto http;

    location / {
        proxy_pass         $upstream_proto://$upstream_app:$upstream_port;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# api.ptraker.com — Express API
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.ptraker.com;

    ssl_certificate     /config/keys/letsencrypt/fullchain.pem;
    ssl_certificate_key /config/keys/letsencrypt/privkey.pem;
    include /config/nginx/ssl.conf;
    include /config/nginx/resolver.conf;

    client_max_body_size 10M;

    set $upstream_app   ptraker-api;
    set $upstream_port  5000;
    set $upstream_proto http;

    location / {
        proxy_pass         $upstream_proto://$upstream_app:$upstream_port;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# supabase.ptraker.com — Supabase Kong gateway (browser Supabase auth client)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name supabase.ptraker.com;

    ssl_certificate     /config/keys/letsencrypt/fullchain.pem;
    ssl_certificate_key /config/keys/letsencrypt/privkey.pem;
    include /config/nginx/ssl.conf;
    include /config/nginx/resolver.conf;

    set $upstream_app   ptraker-supabase-kong;
    set $upstream_port  8000;
    set $upstream_proto http;

    location / {
        proxy_pass         $upstream_proto://$upstream_app:$upstream_port;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect for all ptraker.com domains
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name ptraker.com www.ptraker.com api.ptraker.com supabase.ptraker.com;
    return 301 https://$host$request_uri;
}
