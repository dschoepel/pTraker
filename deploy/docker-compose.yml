---
name: ptraker

# =============================================================================
# ptraker — Application Stack (PRODUCTION — Jupiter R640)
# https://ptraker.com
#
# Depends on supabase-ptraker stack running separately at /data/supabase-ptraker/
#
# Changes from Jupiter VPS version:
#   - Removed proxy_net — added port mappings for Earth Nginx
#   - api and client now on their own isolated network
#   - api reaches Supabase Kong via ptraker-supabase network (shared with supabase-ptraker stack)
#   - SUPABASE_URL updated to use shared network instead of proxy_net container name
#
# Network setup:
#   The supabase-ptraker stack must declare 'ptraker-supabase' as external,
#   and this stack joins the same network so ptraker-api can reach Kong.
#   See supabase-ptraker/docker-compose.yml for the matching network declaration.
#
# Start order:
#   1. cd /data/supabase-ptraker && docker compose up -d
#   2. cd /data/ptraker && docker compose up -d
# =============================================================================

services:

  api:
    image: ghcr.io/dschoepel/ptraker-api:latest
    container_name: ptraker-api
    restart: unless-stopped
    env_file: /data/ptraker/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      TZ: America/Chicago
      CLIENT_URL: https://ptraker.com
    ports:
      - 5000:5000
    networks:
      - ptraker-internal
      - ptraker-supabase   # shared with supabase-ptraker stack

  client:
    image: ghcr.io/dschoepel/ptraker-client:latest
    container_name: ptraker-client
    restart: unless-stopped
    ports:
      - 5001:80
    networks:
      - ptraker-internal

networks:
  ptraker-internal:
    driver: bridge
  ptraker-supabase:
    external: true   # created by supabase-ptraker stack
