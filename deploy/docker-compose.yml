# =============================================================================
# ptraker — Application Stack (PRODUCTION — Jupiter VPS)
# =============================================================================
# Deploy to: /data/ptraker/docker-compose.yml
# Secrets:   /data/ptraker/.env  (copy from .env.example, fill in values)
#
# Both containers join proxy_net — no port bindings.
# Swag reaches ptraker-api:5000 and ptraker-client:80 by container name.
#
# Start:   cd /data/ptraker && docker compose up -d
# Update:  docker compose pull && docker compose up -d
# =============================================================================

name: ptraker

services:

  api:
    image: ghcr.io/dschoepel/ptraker-api:latest
    container_name: ptraker-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      TZ: America/Chicago
      CLIENT_URL: https://ptraker.com
    networks:
      - proxy_net

  client:
    image: ghcr.io/dschoepel/ptraker-client:latest
    container_name: ptraker-client
    restart: unless-stopped
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
